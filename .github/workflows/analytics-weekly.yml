name: Weekly report

# Отчёт за неделю: установки, покупки, подписки и доход из App Store Connect.
# Запускается сам по понедельникам в 05:00 UTC и вручную: Actions -> Weekly report -> Run workflow.
# Репозиторий публичный, поэтому отчёт НЕ коммитится в репозиторий и не печатается в лог:
# короткая сводка уходит в Telegram, полный отчёт хранится артефактом запуска 3 дня.
# Нужны секреты ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (ключ с ролью Sales, Finance или Admin)
# и ASC_VENDOR_NUMBER (секрет или переменная).

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install pyjwt==2.10.1 cryptography==44.0.2 requests==2.32.3
      - name: Build report
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER || vars.ASC_VENDOR_NUMBER }}
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          FEEDBACK_CHAT_ID: ${{ secrets.FEEDBACK_CHAT_ID }}
          REPORT_DIR: ${{ runner.temp }}/weekly
        run: python3 tools/analytics/weekly_report.py
      # Внимание: артефакты публичного репозитория может скачать любой вошедший пользователь GitHub,
      # поэтому срок хранения минимальный.
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: ${{ runner.temp }}/weekly
          retention-days: 3
          if-no-files-found: ignore
