name: Weekly report

# Отчёт за неделю: установки, покупки, подписки и доход из App Store Connect.
# Запускается сам по понедельникам в 05:00 UTC и вручную: Actions -> Weekly report -> Run workflow.
# Репозиторий публичный, поэтому отчёт не коммитится, не печатается в лог и не сохраняется артефактом:
# сводка уходит только в Telegram (FEEDBACK_BOT_TOKEN, FEEDBACK_CHAT_ID). Без них запуск успешен, но отчёт не отправлен.
# Нужны секреты ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (ключ с ролью Sales, Finance или Admin)
# и ASC_VENDOR_NUMBER (секрет или переменная).

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install
        run: pip install pyjwt==2.10.1 cryptography==44.0.2 requests==2.32.3
      - name: Build report
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER || vars.ASC_VENDOR_NUMBER }}
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          FEEDBACK_CHAT_ID: ${{ secrets.FEEDBACK_CHAT_ID }}
          REPORT_DIR: ${{ runner.temp }}/weekly
        run: python3 tools/analytics/weekly_report.py
