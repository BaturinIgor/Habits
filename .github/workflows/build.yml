name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen ldid
          xcodebuild -version

      - name: Check watchOS platform
        # Приложение для часов собирается вместе с приложением для iPhone.
        run: |
          if ! xcodebuild -showsdks | grep -q watchos; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild -showsdks | grep -i watch

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Add feedback bot secrets
        env:
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          FEEDBACK_CHAT_ID: ${{ secrets.FEEDBACK_CHAT_ID }}
        run: tools/feedback/inject_secrets.sh Habits/Info.plist

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project Habits.xcodeproj \
            -scheme Habits \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SIDELOAD' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "---- errors ----"
          grep -E "error:|fatal error" build.log | sort -u | head -150
          echo "---- tail ----"
          tail -40 build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Habits.app"
          ls "$APP" "$APP/PlugIns"
          # SideStore не подписывает приложение для часов, поэтому в эту сборку его не кладём.
          # Часы проверяются через TestFlight (workflow App Store).
          ls "$APP/Watch" || true
          rm -rf "$APP/Watch"
          ldid -S"HabitsWidget/HabitsWidget.entitlements" "$APP/PlugIns/HabitsWidget.appex/HabitsWidget"
          ldid -S"Habits/Habits.entitlements" "$APP/Habits"
          rm -rf Payload Habits.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Habits.ipa Payload
          ls -lh Habits.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Habits-ipa
          path: Habits.ipa

      - name: Publish release
        # Сборки для pull request только проверяют, что проект собирается.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Habits.ipa \
            --title "Привычки, сборка ${{ github.run_number }}" \
            --notes "Скачай Habits.ipa и установи через SideStore." \
            --latest
