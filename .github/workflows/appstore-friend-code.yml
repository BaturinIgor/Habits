name: App Store friend code

# Offer code «Пригласи друга» FRIEND2027 (KAN-228): месяц Pro бесплатно на месячной подписке,
# только новые подписчики. Повторный запуск ничего не дублирует. Скрипт: tools/appstore/asc_friend_code.py.
# Репозиторий публичный: скрипт печатает только ID, статусы, HTTP-коды и коды ошибок Apple.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверить и показать план"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: appstore-offers
  cancel-in-progress: false

jobs:
  friend-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install
        run: pip install -r tools/appstore/requirements.txt

      - name: Check or create FRIEND2027
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.baturinigor.zenhab' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 tools/appstore/asc_friend_code.py --dry-run
          else
            python3 tools/appstore/asc_friend_code.py --apply
          fi
