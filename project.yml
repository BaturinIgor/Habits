name: Habits
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Google Analytics for Firebase (анонимная статистика, без IDFA).
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - path: Habits
      - path: Shared
      - path: WatchShared
      - path: Localization
    entitlements:
      path: Habits/Habits.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.habits
    info:
      path: Habits/Info.plist
      properties:
        CFBundleDisplayName: ZenHab
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, fr, es, pt-BR, it, tr, pl, id, zh-Hans, ja, ko, hi]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Приложение только для iPhone, но App Store Connect проверяет ключ для iPad (ошибка 90474).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        # Семейные группы через iCloud. В сборке для App Store tools/appstore/enable_family.sh
        # включает FamilySharingEnabled и добавляет права iCloud; у SideStore iCloud нет.
        CKSharingSupported: true
        CloudKitContainer: iCloud.com.personal.habits
        FamilySharingEnabled: false
        # Apple Health (чтение). Права HealthKit добавляет tools/appstore/enable_family.sh в сборке для App Store.
        HealthEnabled: false
        # Блокировка по Face ID (Pro).
        NSFaceIDUsageDescription: ZenHab uses Face ID to lock the app so only you can see your habits and mood journal.
        NSHealthShareUsageDescription: ZenHab reads steps, sleep, water, exercise and mindful minutes to check off linked habits for you.
        NSHealthUpdateUsageDescription: ZenHab does not write to Apple Health. It only reads data to check off linked habits.
        BGTaskSchedulerPermittedIdentifiers: [com.personal.habits.refresh]
        # Таймер привычки на экране блокировки (Live Activity).
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # Голосовой ввод привычки. Переводы в Localization/*.lproj/InfoPlist.strings.
        NSMicrophoneUsageDescription: ZenHab uses the microphone so you can create a habit by voice.
        NSSpeechRecognitionUsageDescription: ZenHab turns your words into a habit with a schedule and a reminder time.
        # Telegram-бот для отзывов. Значения подставляет tools/feedback/inject_secrets.sh
        # из секретов FEEDBACK_BOT_TOKEN и FEEDBACK_CHAT_ID; без них отзывы идут через почту.
        FeedbackBotToken: ""
        FeedbackChatID: ""
        # Firebase Analytics: без рекламных сигналов, IDFV и подмены делегата приложения.
        # GoogleService-Info.plist кладёт только сборка для App Store (tools/analytics/add_firebase_config.sh).
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseAppDelegateProxyEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false
        # Firebase сам ничего не собирает: сбор включает код (Analytics.start) по выбору пользователя.
        # Opt-out или opt-in задаёт Analytics.enabledByDefault.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits
        PRODUCT_NAME: Habits
        # Пресет XcodeGen для iOS ставит на уровне таргета "1,2" (iPhone и iPad), поэтому повторяем здесь.
        TARGETED_DEVICE_FAMILY: "1"
        # Профиль подписи для App Store передаёт workflow appstore.yml, в сборке для SideStore он пустой.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Альтернативные иконки (Pro) лежат рядом: AppIcon-Sunset и другие.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Firebase через Swift Package Manager требует -ObjC.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    dependencies:
      - target: HabitsWidget
        embed: true
      # Приложение для Apple Watch лежит внутри приложения для iPhone (папка Watch).
      - target: HabitsWatch
        embed: true
      # FirebaseAnalyticsCore, а не FirebaseAnalytics: без поддержки IDFA (AdSupport) и
      # GoogleAdsOnDeviceConversion. Модуль тот же: import FirebaseAnalytics.
      - package: Firebase
        product: FirebaseAnalyticsCore

  HabitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitsWidget
      - path: Shared
      - path: Localization
        # Фразы Siri нужны только приложению.
        excludes:
          - "**/AppShortcuts.strings"
    entitlements:
      path: HabitsWidget/HabitsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.habits
    info:
      path: HabitsWidget/Info.plist
      properties:
        CFBundleDisplayName: ZenHab
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits.widget
        PRODUCT_NAME: HabitsWidget
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE_NAME)
        SKIP_INSTALL: "YES"

  # Приложение для Apple Watch: привычки на сегодня, отметка в одно касание, таймер (Pro).
  # Данные приходят с iPhone через WatchConnectivity (Habits/Features/WatchSync.swift).
  HabitsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HabitsWatch
      - path: WatchShared
      - path: Localization
        excludes:
          - "**/AppShortcuts.strings"
          - "**/InfoPlist.strings"
    entitlements:
      path: HabitsWatch/HabitsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.habits
    info:
      path: HabitsWatch/Info.plist
      properties:
        CFBundleDisplayName: ZenHab
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, fr, es, pt-BR, it, tr, pl, id, zh-Hans, ja, ko, hi]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.personal.habits
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits.watchkitapp
        PRODUCT_NAME: HabitsWatch
        TARGETED_DEVICE_FAMILY: "4"
        PROVISIONING_PROFILE_SPECIFIER: $(WATCH_PROFILE_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: "YES"
    dependencies:
      - target: HabitsWatchWidget
        embed: true

  # Компликации для циферблата и Смарт-стопки на часах.
  HabitsWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HabitsWatchWidget
      - path: WatchShared
      - path: Localization
        excludes:
          - "**/AppShortcuts.strings"
          - "**/InfoPlist.strings"
    entitlements:
      path: HabitsWatchWidget/HabitsWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.habits
    info:
      path: HabitsWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: ZenHab
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits.watchkitapp.widget
        PRODUCT_NAME: HabitsWatchWidget
        TARGETED_DEVICE_FAMILY: "4"
        PROVISIONING_PROFILE_SPECIFIER: $(WATCH_WIDGET_PROFILE_NAME)
        SKIP_INSTALL: "YES"

  # Автотесты: логика (HabitsTests) и интерфейс на симуляторе (HabitsUITests).
  # Запускает workflow tests.yml.
  HabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitsTests
    dependencies:
      - target: Habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Habits.app/Habits
        BUNDLE_LOADER: $(TEST_HOST)

  HabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HabitsUITests
    dependencies:
      - target: Habits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.habits.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Habits

schemes:
  Habits:
    build:
      targets:
        Habits: all
        HabitsWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HabitsTests
        - HabitsUITests
    archive:
      config: Release
